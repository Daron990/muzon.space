<!DOCTYPE html>

<html lang="ru">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Daron — Music</title>
  
<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        background: #0b0b0b;
        color: #ffffff;
        font-family: Arial, sans-serif;
    }

    .container {
        max-width: 850px;
        margin: 0 auto;
        padding: 60px 25px;
    }

    header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 70px;
    }

    .logo {
        font-size: 22px;
        font-weight: 700;
    }

    .artist {
        color: #777;
        font-size: 14px;
    }

    h1 {
        font-size: 48px;
        margin: 0 0 12px;
    }

    .subtitle {
        color: #777;
        margin-bottom: 50px;
    }

    .track {
        display: flex;
        align-items: center;
        gap: 20px;
        padding: 22px 0;
        border-bottom: 1px solid #222;
    }

    .track-info {
        flex: 1;
    }

    .track-title {
        font-size: 17px;
        margin-bottom: 6px;
    }

    .track-artist {
        color: #666;
        font-size: 14px;
    }

    audio {
        width: 280px;
    }

    .download {
        color: white;
        text-decoration: none;
        border: 1px solid #333;
        padding: 10px 14px;
        border-radius: 8px;
        font-size: 13px;
    }

    .download:hover {
        background: #fff;
        color: #000;
    }

    @media (max-width: 700px) {
        .track {
            flex-direction: column;
            align-items: flex-start;
        }

        audio {
            width: 100%;
        }

        h1 {
            font-size: 38px;
        }
    }
</style>
<header>
    <div class="logo">Daron</div>
    <div class="artist">personal music library</div>
</header>

<h1>Моя музыка</h1>
<div class="subtitle">Слушай и скачивай мои треки.</div>

<div class="track">

    <div class="track-info">
        <div class="track-title">Без названия</div>
        <div class="track-artist">Daron</div>
    </div>

    <audio controls>
        <source src="Daron_Без_названия.mp3" type="audio/mpeg">
    </audio>

    <a class="download"
       href="Daron_Без_названия.mp3"
       download>
        ↓
    </a>

</div>
